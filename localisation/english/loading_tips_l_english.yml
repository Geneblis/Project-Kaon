l_english:
  LOADING_TIP_0:0 "If the world thinks you’re a monster, what does it matter? The world is wrong. But when you start to think of yourself as a monster... \n- Megatron"
  LOADING_TIP_1:0 "If the world thinks you’re a monster, what does it matter? The world is wrong. But when you start to think of yourself as a monster... \n- Megatron"
  LOADING_TIP_2:0 "Why don't you all sit back while the DJ spins the story.\n-Soundwave"
  LOADING_TIP_3:0 "When Optimus stares into the abyss, the abyss is too blinded by his light to stare back.\n"
  LOADING_TIP_4:0 "A Decepticon kills an Autobot, you hate him. But a million Autobots? A billion? It's meaningless. That's the problem: the greater the crime, the harder it is to process a response. \n-Getaway"
  LOADING_TIP_5:0 "We are all equal, under Primus. We started a war to fight for that equality. \n-Soundwave"
  LOADING_TIP_6:0 "Good and evil fade away. History shall judge me... Victorious. \n-Megatron"
  LOADING_TIP_7:0 "Tell me what's on your mind, or I'll splatter it on the wall and see for myself \n-Blitzwing"
  LOADING_TIP_8:0 "Sometimes deception is necessary, when those who should listen to the truth will not, and will only understand once they have been lied to and forced to see their own lies. \n-Megatron"
  LOADING_TIP_9:0 "Never a dull moment when you're a Wrecker. \n-Broadside"
  LOADING_TIP_10:0 "Wreck and Rule! \n-Impactor"
  LOADING_TIP_11:0 "As I've tried to teach you, undisciplined thinking can make even the simplest task impossible. \n-Ultra Magnus"
  LOADING_TIP_12:0 "I found myself in a world where everyone was a killer, a, criminal. The black and white I wore was confronted by an endless sea of gray. \n-Prowl"
  LOADING_TIP_13:0 "Once, we were laborers, fighters, intellectuals... Once we all had lives. Lives we walked away from, for a shared belief that inequality could not be allowed to stand. \n-Soundwave"
  LOADING_TIP_14:0 "Reject your work. Reject your alt-mode. Resist the system. [...] We are all equal, and we have a right to decide how to live our lives. \n-Megatron"
  LOADING_TIP_15:0 "I should have anticipated his [Megatron] utter lack of feeling for his fellow Cybertronians. But at the expense of the lives of many thousands of my fellow Autobots, I did not. \n-Optimus Prime"
  LOADING_TIP_16:0 "[...] And inside every tyrant, there is a frustrated performer. \n-Ratchet"
  LOADING_TIP_17:0 "Someone once said that poetry is a hazardous attempt at self-understanding. \n-Minimus Ambus"
  LOADING_TIP_18:0 "I wanted you to tell me that after the spark dies, it lives. I wanted hope. \n-Nightbeat"
  LOADING_TIP_19:0 "Optimus Prime is not a savior. He's a tool of the elite, an agent of the status-quo. \n-Brawl"
  LOADING_TIP_20:0 "Knowledge is not a gateway to a higher understanding of things. It is a weapon. And I intend to use it that way. \n-Shockwave"
  LOADING_TIP_21:0 "You remember what color badge you wear; It's red, so stark against your black and white body. Such odd colors for one so morally overcast and grey. \n-Tarantulas"
  LOADING_TIP_22:0 "Few beings think of themselves as evil. Many justify their actions as good, even if they are not. But if you believe the 'good guys' would not harm any life-form, then you may consider me a member of that team. \n-Gears"
  LOADING_TIP_23:0 "'Til all are one. \n-Autobot rally cry"
  LOADING_TIP_24:0 "We will win because of the superiority of our ideals, not our firepower. \n-Sky-byte"
  LOADING_TIP_25:0 "Right and wrong. What would the you of old have thought of you today? \n-Galvatron"
  LOADING_TIP_26:0 "We cast away all sense of fear; the die is struck, so best of luck. Perhaps our lives will end here. \n-Sky-byte"
  LOADING_TIP_27:0 "Peace is not an achievement, but a responsability. \n-Sentinel Prime"
  LOADING_TIP_28:0 "You told us we were here to end a war. That's worth fighting for; worth dying for. \n-Aileron"
  LOADING_TIP_29:0 "There is no point in living if you sacrifice everything you are to do it. \n-Drift" 
  LOADING_TIP_30:0 "Why? Because I admit to enjoying it? I don't need a war to hide behind. How many have you killed? \n-Hellbat" 
  LOADING_TIP_31:0 "Utility over morality. Purpose over personality. Usefulness over happiness. \n-The Fifth letter from Messatine"
  LOADING_TIP_32:0 "My Megatron is a hero. A revolutionary who knew when to fight and when to keep fighting. \n-Tarn"
  LOADING_TIP_33:0 "A new horizon opens, and Megatron and the Decepticons have come to show you the way! Cybertron! The crisis is over! Order and freedom are within reach! \n-Strika"
  LOADING_TIP_34:0 "Like the Matrix, you are a symbol, Orion. And people need symbols, just as they need order. Often... The two are the same. \n-Zeta Prime"
  LOADING_TIP_35:0 "You're being deceived. \n-Decepticon Motto"
  LOADING_TIP_36:0 "The words of a mal-bred collaborator. Decepticons; twisted, malformed colonists; and Autobots who abandoned their fight. \n-Sentinel Prime"
  LOADING_TIP_37:0 "To punish and enslave. \n-Barricade"
  LOADING_TIP_38:0 "I suppose you could call me an agnostic. You see, I'm not sure about heaven... But I'm pretty sure hell exists. \n-Tarn"
  LOADING_TIP_39:0 "If they cannot give up their precious war, then it's war they'll have. \n-Starscream"
  LOADING_TIP_40:0 "If speaking the truth is a deception, then we are gladly guilty. \n-Megatron"
  LOADING_TIP_41:0 "Once you've created paradise, how do you decide who's allowed to live there? After all, there's only a finite amount of room. \n-Ultra Magnus"
  LOADING_TIP_42:0 "Fate rarely calls upon us at a moment of our choosing. \n-Optimus Prime"
  LOADING_TIP_43:0 "If there's one thing I've learned since we lost the war it's that things are rarely black and white. \n-Misfire"
  LOADING_TIP_44:0 "Never run when you can fight. \n-Breakdown"
  LOADING_TIP_45:0 "I am your superior, in every conceivable way. \n-Shockwave"
  LOADING_TIP_46:0 "Belief is a means to an end for him, a path to victory. But that is not the way of a true Prime. \n-Pyra"
  LOADING_TIP_47:0 ""Victory is the path to belief, and I know the path fate demands I walk. \n-Pyra"
  LOADING_TIP_48:0 "The easiest lies are the ones we tell ourselves. \n-Arcee"
  LOADING_TIP_49:0 "...Fortunately for us, class war is my specialty. \n-Soundwave"
  LOADING_TIP_50:0 "But peace at any cost demands oppression. \n-Optimus Prime"
  LOADING_TIP_51:0 "We compromised alot back then, that proved to be Megatron's undoing. His methods were vicious, which attracted followers like Starscream... Yet Megatron's goal was righteous, that attracted followers like Soundwave. \n-Optimus Prime"
  LOADING_TIP_52:0 "What started as a battle for freedom became a war of retribution. But can you blame them? One can't oppress a people then ask for trust. \n-Optimus Prime"
  LOADING_TIP_53:0 "[The Decepticons] are people! They want change. Some of them are terrible, and so are some of yours Autobots. \n-Jetfire"
  LOADING_TIP_54:0 "[...] Then he [Starscream] told us we should get new alt-modes so we all looked the same. 'Strength in Unity' or whatever he said. He just liked looking at himself. \n-Skywarp"
  LOADING_TIP_55:0 "A spark is shaped by all who touch it, but the first hand meant to is Primus'; Sparks are meant to be forged in the design of his divine choosing... Bots not born, but build, never allowed to find their true shape. Instead, forged and formed, to the specification of another's greed. \n-Windblade"
  LOADING_TIP_56:0 "History is a path, one that often circles back on itself. But for a planet in chaos, the promise of unity was a light of hope. A story we told ourselves to steel against the night. \n-Alpha Trion"
  LOADING_TIP_57:0 "There's a difference between saying all stories are true... And believing all lies. \n-Alpha Trion"
  LOADING_TIP_58:0 "Optimus tells me you believe in equality [...] But you have turned Equality into Anarchy. This is the failure of Cybertronian civilization, of Democracy. \n-Onyx Prime"
  LOADING_TIP_59:0 "We are our actions, not our hopes. \n-Prowl"
  LOADING_TIP_60:0 "If you lead others to make your life better, you will be a tyrant. If you lead others to make their lives better, you will be a leader. \n-Metroplex"
  LOADING_TIP_61:0 "Vengeance welcomes mistakes. \n-Megatronus"