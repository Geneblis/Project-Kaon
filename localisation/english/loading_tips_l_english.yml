l_english:
  LOADING_TIP_0:0 "If the world thinks you’re a monster, what does it matter?  The world is wrong. But when you start to think of yourself as a monster... \n- Megatron."
  LOADING_TIP_1:0 "Why don't you all sit back while the DJ spins the story. \n- Soundwave."
  LOADING_TIP_2:0 "When Optimus stares into the abyss, the abyss is too blinded by his light to stare back.\n"
  LOADING_TIP_3:0 "A Decepticon kills an Autobot, you hate him. But a million Autobots? A billion? It's meaningless. That's the problem: the greater the crime, the harder it is to process a response. \n- Getaway"
  LOADING_TIP_4:0 "No, the great Optimus Prime is nothing without a war! \n- Megatron."
  