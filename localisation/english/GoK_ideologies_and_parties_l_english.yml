 ochlocracy:0 "Mob Rule"
 ochlocracy_desc:0 "§WGang Rule§!\n\nThe rule of the mob, where power belongs to those who can rally the masses through coercion, not to rulers or councils. It rejects rigid hierarchies, believing leadership should rise and fall with the will of the people. Decisions are driven by passion and urgency, not laws or tradition. To its followers, it is true freedom, where no elite can silence the many. To its critics, it is chaos, where might and numbers decide fate."
 
 nonaligned:0 "Non-Aligned"
 nonaligned_desc:0 "Peace will come for all beings."
 despotism:0 "Despotism"
 despotism_desc:0 "§WDespotism§!\n\nDespotism is a form of government in which a single entity rules with absolute power. Normally, that entity is an individual, the despot."
 aristocracy:0 "Aristocracy"
 aristocracy_desc:0 "§WAristocracy§!\n\n"
 band_society:0 "Band Society"
 band_society_desc:0 "§WBand Society§!\n\n"
 
 ascenticonism:0 "Ascenticonism"
 ascenticonism_desc:0 "Life is yours to shape."
 ascenticonism_sub_ideology:0 "Ascenticonism"
 ascenticonism_sub_ideology_desc:0 "§0Ascenticonism§!\n\nAscenticonism is a philosophy advocates for the right that any life is a canvas meant to be shaped entirely by one's own choices, free from the burdens of your birth-right. Yet one must still bear the responsibility to pave the way for those yet to come, unionizing their work for a better future where all are equal."
 
 faction_ascensionism_united_cybertron_league:0 "United Cybertron League"
 faction_ascensionism_cybertron_unity:0 "Cybertron Unity"
 faction_ascensionism_the_singularity:0 "The Singularity"
 faction_ascensionism_miners:0 "Miners"
 
 decepticonism:0 "Decepticonism"
 decepticonism_desc:0 "Tyranny is the key to salvation."
 gladiatorianism:0 "Gladiatorianism"
 gladiatorianism_desc:0 "§0Gladiatorianism§!\n\nGladiatorianism is a philosophy inspired by the legends of the Knights of Cybertron, where true leadership arises not only from brute strength, but also from integrity and valor. Advocating for the belief of abolishing the unjust inequality amongst the masses by promoting the idea that unity should be earned to those who prove their mettle through honor in battle, with leaders chosen not by birthright but by the esteem of their people. \n\nIt seeks to establish a society based on old principles in which merit, rather than status, determines one's place."
 kratocracy:0 "Kratocracy"
 kratocracy_desc:0 "§0Kratocracy§!\n\nKratocratic Decepticonism believes that the only way to eliminate inequality is through the rule of the strongest. Strength and power are seen as the ultimate tools to enforce order and maintain peace."
 decepticonism_technoism:0 "Technoism"
 decepticonism_technoism_desc:0 "§0Technoism§!\n\nTechnoism is the belief that mechanical species are inherently superior to organic ones."
 doluscracy:0 "Deceptonism"
 doluscracy_desc:0 ""

 
 reformism:0 "Reformism"
 reformism_desc:0 "Freedom is the right of all sentient beings."
 orionism:0 "Orionism"
 orionism_desc:0 "§tOrionism§!\n\nStriving for a combination of Megatron's idealism and the current status-quo. Orionism seeks to transition into a more fair society by reforming the social structures within the current system."
 kaonism:0 "Kaonism"
 kaonism_desc:0 "§tKaonism§!\n\n"
 consociationalism:0 "Consociationalism"
 consociationalism_desc:0 "§tConsociationalism§!\n\nConsociationalism focus on governmental stability, the survival of the power and peace, avoidance of violence at all cust if may be."
 
