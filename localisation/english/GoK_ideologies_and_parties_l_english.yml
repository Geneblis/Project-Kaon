ascenticonism_sub_ideology:0 "Ascenticonism"
ascenticonism_sub_ideology_desc:0 "§0Ascenticonism§!\n\nYour life is yours to shape. In doing so, you owe nothing to those who came before you. But you owe everything to those as yet unforged. Let no shaping of yours, limit what they, in their turn, might yet be and achieve."

