 functionalism:0 "Functionalism"
 functionalism_desc:0 "§tFunctionalism§!\n\nTo quash anykind of Cybertronian individualism under a caste system, Functionalism seeks to organize Cybertronian and their vocations by their natural alternate mode."
 conformist_technoism:0 "Technoism"
 conformist_technoism_desc:0 "§tTechnoism§!\n\nTechnoism is the belief that mechanical species are inherently superior to organic ones."
 hardline_functionalism:0 "Hardline Functionalism"
 hardline_functionalism_desc:0 "§tHardline Functionalism§!\n\nTo quash this kind of Cybertronian individualism under a caste system, Hardline Functionalism seeks to organize Cybertronian and their vocations by their natural alternate mode, going above and beyond and seeking to abolish all kinds of individualism, returning all common folk into mindless serving machines."
