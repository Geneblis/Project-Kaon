 autocracy:0 "Autocracy"
 autocracy_desc:0 "§tAutocracy§!\n\n"
 stratocracy:0 "Stratocracy"
 stratocracy_desc:0 "§tStratocracy§!\n\nStratocracy is control. Taken by ideas such as discipline, order, national security and patriotism, operated by a military or militarized class. Unlike a military junta, the role of the military in such a system, they are incorporated more permanently into the political structure."
