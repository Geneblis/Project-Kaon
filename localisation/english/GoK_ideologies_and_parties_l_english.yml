decepticonism:0 "Decepticonism"
decepticonism_desc:0 "Purification is the key to salvation."
gladiatorianism:0 "Gladiatorianism"
gladiatorianism_desc:0 "§0Gladiatorianism§!\n\nGladiatorianism aims to abolish unequal rights imposed by higher-class Cybertronians on the lower caste, regardless of the costs."
kratocracy:0 "Kratocracy"
kratocracy_desc:0 "§0Kratocracy§!\n\nKratocratic Decepticonism sees as the only way to abolish inequality the rule of the fittest, and thus to maintain order and peace, strength and might come forward."
decepticonism_technoism:0 "Technoism"
decepticonism_technoism_desc:0 "§0Technoism§!\n\nTechnoism is the belief that mechanical species are inherently superior to organic ones."

reformism:0 "Reformism"
reformism_desc:0 "Freedom is the right of all sentient beings."
orionism:0 "Orionism"
orionism_desc:0 "§tOrionism§!\n\nStriving for a combination of Megatron's idealism and the current status-quo. Orionism seeks to transition into a more fair society by reforming the social structures within the current system."
kaonism:0 "Kaonism"
kaonism_desc:0 "§tKaonism§!\n\n"
consociationalism:0 "Consociationalism"
consociationalism_desc:0 "§tConsociationalism§!\n\nConsociationalism focus on governmental stability, the survival of the power and peace, avoidance of violence at all cust if may be."

